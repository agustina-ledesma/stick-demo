  <!-- Cara superior de la tapa -->
  <path fill="url(#cuaderno-g-tapa__E)" d="M-20,759.8 L218,733.7 L524.6,768.4 Q527.6,769 525.2,769.9 L13,839.9 L-20,835.9Z"/>
