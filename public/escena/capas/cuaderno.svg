<defs>
  <!-- Tapa: de izquierda (refleja pared y marco) a derecha (refleja el cielo, con un escalón de brillo pasando la punta de la lapicera) -->
  <linearGradient id="cuaderno-g-tapa__E" gradientUnits="userSpaceOnUse" x1="0" y1="838" x2="526" y2="772">
    <stop offset=".04" style="stop-color:var(--cuaderno-tapa-izq)"/>
    <stop offset=".56" style="stop-color:var(--cuaderno-tapa-med)"/>
    <stop offset=".65" style="stop-color:var(--cuaderno-tapa-der)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-tapa-der)"/>
  </linearGradient>
  <!-- Fondo de la tapa, detrás de la lapicera: más oscuro, se disuelve donde el clip cruza el borde -->
  <linearGradient id="cuaderno-g-velo__E" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
    <stop offset="0" style="stop-color:var(--cuaderno-velo)"/>
    <stop offset=".8" style="stop-color:var(--cuaderno-velo-der)"/>
    <stop offset=".89" style="stop-color:var(--cuaderno-velo-der)" stop-opacity=".9"/>
    <stop offset="1" style="stop-color:var(--cuaderno-velo-der)" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-canto__E" gradientUnits="userSpaceOnUse" x1="260" y1="805.9" x2="261.2" y2="814.2">
    <stop offset="0" style="stop-color:var(--cuaderno-canto-luz)"/>
    <stop offset=".32" style="stop-color:var(--cuaderno-canto)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-canto)"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-hoja__E" gradientUnits="userSpaceOnUse" x1="13" y1="0" x2="513" y2="0">
    <stop offset="0" style="stop-color:var(--cuaderno-hoja-izq)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-hoja-der)"/>
  </linearGradient>
  <!-- Oclusión bajo el vuelo de la tapa y contra la tapa de abajo -->
  <linearGradient id="cuaderno-g-hoja-ao__E" gradientUnits="userSpaceOnUse" x1="260" y1="814.2" x2="264" y2="843.4">
    <stop offset="0" style="stop-color:var(--cuaderno-hoja-sombra)" stop-opacity=".9"/>
    <stop offset=".1" style="stop-color:var(--cuaderno-hoja-sombra)" stop-opacity=".5"/>
    <stop offset=".26" style="stop-color:var(--cuaderno-hoja-sombra)" stop-opacity="0"/>
    <stop offset=".8" style="stop-color:var(--cuaderno-base-luz)" stop-opacity="0"/>
    <stop offset="1" style="stop-color:var(--cuaderno-base-luz)" stop-opacity=".75"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-base__E" gradientUnits="userSpaceOnUse" x1="260" y1="843.4" x2="261.4" y2="853.6">
    <stop offset="0" style="stop-color:var(--cuaderno-base-luz)"/>
    <stop offset=".4" style="stop-color:var(--cuaderno-base)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-base-osc)"/>
  </linearGradient>
  <!-- Lapicera: degradés transversales al eje -->
  <linearGradient id="cuaderno-g-cuerpo__E" gradientUnits="userSpaceOnUse" x1="120" y1="760.4" x2="124.6" y2="795.8">
    <stop offset="0" style="stop-color:var(--cuaderno-lap-rebote)"/>
    <stop offset=".06" style="stop-color:var(--cuaderno-lap-rebote)"/>
    <stop offset=".13" style="stop-color:var(--cuaderno-lap-brillo)"/>
    <stop offset=".2" style="stop-color:var(--cuaderno-lap-brillo)"/>
    <stop offset=".32" style="stop-color:var(--cuaderno-lap-frio)"/>
    <stop offset=".48" style="stop-color:var(--cuaderno-lap-negro)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-lap-negro)"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-grip__E" gradientUnits="userSpaceOnUse" x1="258" y1="753.1" x2="261" y2="775.6">
    <stop offset="0" style="stop-color:var(--cuaderno-lap-brillo)"/>
    <stop offset=".1" style="stop-color:var(--cuaderno-lap-frio)"/>
    <stop offset=".28" style="stop-color:var(--cuaderno-lap-negro)"/>
    <stop offset=".5" style="stop-color:var(--cuaderno-lap-rebote)"/>
    <stop offset=".7" style="stop-color:var(--cuaderno-lap-rebote)"/>
    <stop offset=".9" style="stop-color:var(--cuaderno-lap-negro)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-lap-negro)"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-metal__E" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--cuaderno-metal-osc)"/>
    <stop offset=".04" style="stop-color:var(--cuaderno-metal-osc)"/>
    <stop offset=".12" style="stop-color:var(--cuaderno-metal-luz)"/>
    <stop offset=".19" style="stop-color:var(--cuaderno-metal-luz)"/>
    <stop offset=".3" style="stop-color:var(--cuaderno-metal-med)"/>
    <stop offset=".42" style="stop-color:var(--cuaderno-metal-med)"/>
    <stop offset=".54" style="stop-color:var(--cuaderno-metal-rebote)"/>
    <stop offset=".62" style="stop-color:var(--cuaderno-metal-rebote)"/>
    <stop offset=".92" style="stop-color:var(--cuaderno-metal-osc)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-metal-osc)"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-culata__E" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--cuaderno-metal-osc)"/>
    <stop offset=".14" style="stop-color:var(--cuaderno-metal-osc)"/>
    <stop offset=".27" style="stop-color:var(--cuaderno-metal-luz)"/>
    <stop offset=".33" style="stop-color:var(--cuaderno-metal-luz)"/>
    <stop offset=".46" style="stop-color:var(--cuaderno-metal-med)"/>
    <stop offset=".56" style="stop-color:var(--cuaderno-lap-frio)"/>
    <stop offset=".7" style="stop-color:var(--cuaderno-lap-negro)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-lap-negro)"/>
  </linearGradient>
  <linearGradient id="cuaderno-g-punta__E" gradientUnits="userSpaceOnUse" x1="313" y1="745.4" x2="315.7" y2="767">
    <stop offset="0" style="stop-color:var(--cuaderno-metal-blanco)"/>
    <stop offset=".18" style="stop-color:var(--cuaderno-metal-blanco)"/>
    <stop offset=".3" style="stop-color:var(--cuaderno-metal-med)"/>
    <stop offset=".44" style="stop-color:var(--cuaderno-metal-oro)"/>
    <stop offset=".7" style="stop-color:var(--cuaderno-metal-oro)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-punta-osc)"/>
  </linearGradient>
  <!-- Clip: plateado, transversal a la barra -->
  <linearGradient id="cuaderno-g-clip__E" gradientUnits="userSpaceOnUse" x1="255" y1="749.6" x2="255.4" y2="754.4">
    <stop offset="0" style="stop-color:var(--cuaderno-clip-luz)"/>
    <stop offset=".3" style="stop-color:var(--cuaderno-clip-luz)"/>
    <stop offset="1" style="stop-color:var(--cuaderno-clip-osc)"/>
  </linearGradient>
  <!-- Filo de luz a lo largo de la lapicera: se apaga en las puntas -->
  <linearGradient id="cuaderno-g-filo__E" gradientUnits="userSpaceOnUse" x1="50" y1="775" x2="306" y2="750">
    <stop offset="0" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity="0"/>
    <stop offset=".14" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity=".7"/>
    <stop offset=".5" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity=".3"/>
    <stop offset=".66" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity=".25"/>
    <stop offset=".86" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity=".7"/>
    <stop offset="1" style="stop-color:var(--cuaderno-lap-filo)" stop-opacity="0"/>
  </linearGradient>
  <filter id="cuaderno-f-suave__E" filterUnits="userSpaceOnUse" x="-40" y="700" width="640" height="241">
    <feGaussianBlur stdDeviation="4.5"/>
  </filter>
  <filter id="cuaderno-f-fino__E" filterUnits="userSpaceOnUse" x="-40" y="700" width="640" height="241">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
</defs>

<g id="cuaderno-todo__E">
