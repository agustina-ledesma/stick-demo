<defs>
  <!-- Cara superior de la base: de la esquina lejana (izquierda) hacia la bisagra (derecha) -->
  <linearGradient id="laptop-g-sup__E" gradientUnits="userSpaceOnUse" x1="1110" y1="0" x2="1530" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-sup-1)"/>
    <stop offset=".45" style="stop-color:var(--laptop-sup-2)"/>
    <stop offset=".74" style="stop-color:var(--laptop-sup-3)"/>
    <stop offset="1" style="stop-color:var(--laptop-sup-4)"/>
  </linearGradient>
  <!-- Reflejo de la luz sobre el aluminio: a la izquierda (amanecer, mediodía, noche) o corrido a la derecha (atardecer) -->
  <radialGradient id="laptop-g-brillo-a__E" gradientUnits="userSpaceOnUse" cx="1316" cy="808" r="56">
    <stop offset="0" style="stop-color:var(--laptop-brillo)"/>
    <stop offset=".4" style="stop-color:var(--laptop-brillo)" stop-opacity=".55"/>
    <stop offset="1" style="stop-color:var(--laptop-brillo)" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="laptop-g-brillo-b__E" gradientUnits="userSpaceOnUse" cx="1250" cy="826" r="64">
    <stop offset="0" style="stop-color:var(--laptop-brillo)"/>
    <stop offset=".4" style="stop-color:var(--laptop-brillo)" stop-opacity=".5"/>
    <stop offset="1" style="stop-color:var(--laptop-brillo)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="laptop-g-pad__E" gradientUnits="userSpaceOnUse" x1="1331" y1="0" x2="1520" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-pad)" stop-opacity="0"/>
    <stop offset="1" style="stop-color:var(--laptop-pad)" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="laptop-g-pozo__E" gradientUnits="userSpaceOnUse" x1="1336" y1="0" x2="1420" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-pozo)" stop-opacity=".25"/>
    <stop offset="1" style="stop-color:var(--laptop-pozo)"/>
  </linearGradient>
  <!-- El apoyamanos del lado de la cámara queda más apagado que el fondo -->
  <linearGradient id="laptop-g-frente__E" gradientUnits="userSpaceOnUse" x1="1300" y1="0" x2="1410" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-sup-frente)" stop-opacity="0"/>
    <stop offset="1" style="stop-color:var(--laptop-sup-frente)"/>
  </linearGradient>
  <!-- Sombra de la tapa sobre la base (sólo atardecer) -->
  <linearGradient id="laptop-g-sombra-base__E" gradientUnits="userSpaceOnUse" x1="1360" y1="0" x2="1525" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-sombra-base)" stop-opacity="0"/>
    <stop offset="1" style="stop-color:var(--laptop-sombra-base)"/>
  </linearGradient>
  <!-- Canto de la base: el aluminio refleja la madera -->
  <linearGradient id="laptop-g-lado__E" gradientUnits="userSpaceOnUse" x1="1110" y1="0" x2="1506" y2="0">
    <stop offset="0" style="stop-color:var(--laptop-lado-1)"/>
    <stop offset=".6" style="stop-color:var(--laptop-lado-2)"/>
    <stop offset=".78" style="stop-color:var(--laptop-lado-3)"/>
    <stop offset=".91" style="stop-color:var(--laptop-lado-3)"/>
    <stop offset=".95" style="stop-color:var(--laptop-lado-4)"/>
    <stop offset=".975" style="stop-color:var(--laptop-lado-3)"/>
    <stop offset="1" style="stop-color:var(--laptop-lado-5)"/>
  </linearGradient>
  <linearGradient id="laptop-g-lado-vol__E" gradientUnits="userSpaceOnUse" x1="1300" y1="860.5" x2="1296.5" y2="884.2">
    <stop offset="0" style="stop-color:var(--laptop-lado-luz)" stop-opacity=".95"/>
    <stop offset=".1" style="stop-color:var(--laptop-lado-luz)" stop-opacity=".3"/>
    <stop offset=".24" style="stop-color:var(--laptop-lado-luz)" stop-opacity="0"/>
    <stop offset=".5" style="stop-color:var(--laptop-lado-som)" stop-opacity="0"/>
    <stop offset=".8" style="stop-color:var(--laptop-lado-som)" stop-opacity=".55"/>
    <stop offset="1" style="stop-color:var(--laptop-lado-som)" stop-opacity=".9"/>
  </linearGradient>
  <!-- Tapa vista de atrás: en sombra, más clara al centro y más oscura abajo -->
  <linearGradient id="laptop-g-tapa__E" gradientUnits="userSpaceOnUse" x1="1640" y1="360" x2="1590" y2="915">
    <stop offset="0" style="stop-color:var(--laptop-tapa-1)"/>
    <stop offset=".45" style="stop-color:var(--laptop-tapa-2)"/>
    <stop offset=".62" style="stop-color:var(--laptop-tapa-2)"/>
    <stop offset=".82" style="stop-color:var(--laptop-tapa-3)"/>
    <stop offset="1" style="stop-color:var(--laptop-tapa-4)"/>
  </linearGradient>
  <linearGradient id="laptop-g-tapa-osc__E" gradientUnits="userSpaceOnUse" x1="1563" y1="700" x2="1706.7" y2="743">
    <stop offset="0" style="stop-color:var(--laptop-tapa-4)" stop-opacity="0"/>
    <stop offset=".15" style="stop-color:var(--laptop-tapa-4)" stop-opacity="0"/>
    <stop offset="1" style="stop-color:var(--laptop-tapa-4)" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="laptop-g-tapa-reflejo__E" gradientUnits="userSpaceOnUse" x1="1563" y1="700" x2="1668.4" y2="731.6">
    <stop offset="0" style="stop-color:var(--laptop-tapa-reflejo)"/>
    <stop offset=".45" style="stop-color:var(--laptop-tapa-reflejo)" stop-opacity=".4"/>
    <stop offset="1" style="stop-color:var(--laptop-tapa-reflejo)" stop-opacity="0"/>
  </linearGradient>
  <!-- Filo de la tapa: a lo largo (se apaga hacia la bisagra) y a través (redondeado) -->
  <linearGradient id="laptop-g-canto__E" gradientUnits="userSpaceOnUse" x1="1661" y1="360" x2="1503" y2="906">
    <stop offset="0" style="stop-color:var(--laptop-canto-cielo)"/>
    <stop offset=".025" style="stop-color:var(--laptop-canto-cielo)"/>
    <stop offset=".09" style="stop-color:var(--laptop-canto-med)"/>
    <stop offset=".26" style="stop-color:var(--laptop-canto-luz)"/>
    <stop offset=".52" style="stop-color:var(--laptop-canto-luz)"/>
    <stop offset=".81" style="stop-color:var(--laptop-canto-med)"/>
    <stop offset=".925" style="stop-color:var(--laptop-canto-osc)"/>
    <stop offset=".975" style="stop-color:var(--laptop-canto-fin)"/>
    <stop offset="1" style="stop-color:var(--laptop-canto-fin)" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="laptop-g-canto-vol__E" gradientUnits="userSpaceOnUse" x1="1563" y1="700" x2="1571.7" y2="702.6">
    <stop offset="0" style="stop-color:var(--laptop-tapa-2)" stop-opacity=".12"/>
    <stop offset=".3" style="stop-color:var(--laptop-tapa-2)" stop-opacity="0"/>
    <stop offset=".55" style="stop-color:var(--laptop-tapa-2)" stop-opacity=".22"/>
    <stop offset="1" style="stop-color:var(--laptop-tapa-2)" stop-opacity=".8"/>
  </linearGradient>
  <linearGradient id="laptop-g-canto-brillo__E" gradientUnits="userSpaceOnUse" x1="1663" y1="368" x2="1508" y2="886">
    <stop offset="0" style="stop-color:var(--laptop-canto-brillo)" stop-opacity="0"/>
    <stop offset=".12" style="stop-color:var(--laptop-canto-brillo)" stop-opacity=".85"/>
    <stop offset=".6" style="stop-color:var(--laptop-canto-brillo)" stop-opacity=".55"/>
    <stop offset=".9" style="stop-color:var(--laptop-canto-brillo)" stop-opacity=".12"/>
    <stop offset="1" style="stop-color:var(--laptop-canto-brillo)" stop-opacity="0"/>
  </linearGradient>
  <!-- Sombra larga del atardecer sobre la mesa: densa junto a la base, se pierde hacia la punta -->
  <linearGradient id="laptop-g-sombra-larga__E" gradientUnits="userSpaceOnUse" x1="1240" y1="862" x2="770" y2="934">
    <stop offset="0" style="stop-color:var(--laptop-sombra)"/>
    <stop offset=".3" style="stop-color:var(--laptop-sombra)" stop-opacity=".8"/>
    <stop offset=".7" style="stop-color:var(--laptop-sombra)" stop-opacity=".3"/>
    <stop offset="1" style="stop-color:var(--laptop-sombra)" stop-opacity="0"/>
  </linearGradient>
  <!-- Filtro propio de la sombra larga, en sRGB: en linearRGB un degradé oscuro y translúcido se cuantiza en bandas con salto de tono -->
  <filter id="laptop-f-larga__E" filterUnits="userSpaceOnUse" x="680" y="800" width="1080" height="200" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="laptop-f-suave__E" filterUnits="userSpaceOnUse" x="1000" y="800" width="760" height="200">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="laptop-f-fino__E" filterUnits="userSpaceOnUse" x="1000" y="800" width="760" height="200">
    <feGaussianBlur stdDeviation="1.6"/>
  </filter>
</defs>

